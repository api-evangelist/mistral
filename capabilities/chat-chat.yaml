naftiko: 1.0.0-alpha2
info:
  label: Mistral AI Chat API — Chat
  description: 'Mistral AI Chat API — Chat. 1 operations. Lead operation: Mistral AI Create a chat completion. Self-contained
    Naftiko capability covering one Mistral business surface.'
  tags:
  - Mistral
  - Chat
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MISTRAL_API_KEY: MISTRAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: chat-chat
    baseUri: https://api.mistral.ai/v1
    description: Mistral AI Chat API — Chat business capability. Self-contained, no shared references.
    resources:
    - name: chat-completions
      path: /chat/completions
      operations:
      - name: createchatcompletion
        method: POST
        description: Mistral AI Create a chat completion
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MISTRAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: chat-chat-rest
    port: 8080
    description: REST adapter for Mistral AI Chat API — Chat. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/chat/completions
      name: chat-completions
      description: REST surface for chat-completions.
      operations:
      - method: POST
        name: createchatcompletion
        description: Mistral AI Create a chat completion
        call: chat-chat.createchatcompletion
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: chat-chat-mcp
    port: 9090
    transport: http
    description: MCP adapter for Mistral AI Chat API — Chat. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: mistral-ai-create-chat-completion
      description: Mistral AI Create a chat completion
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: chat-chat.createchatcompletion
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
