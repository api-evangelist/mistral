    namespace: models-models
    baseUri: https://api.mistral.ai/v1
    description: Mistral AI Models API — Models business capability. Self-contained, no shared references.
    resources:
    - name: models
      path: /models
      operations:
      - name: listmodels
        method: GET
        description: Mistral AI List available models
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: models-model_id
      path: /models/{model_id}
      operations:
      - name: getmodel
        method: GET
        description: Mistral AI Get model details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatemodel
        method: PATCH
        description: Mistral AI Update a fine-tuned model
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletemodel
        method: DELETE
        description: Mistral AI Delete a fine-tuned model
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: models-model_id-archive
