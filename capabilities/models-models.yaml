      - type: object
        mapping: $.
    - name: mistral-ai-update-fine-tuned
      description: Mistral AI Update a fine-tuned model
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: models-models.updatemodel
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
