"""
Mistral AI GraphQL Schema
Conceptual GraphQL representation of the Mistral AI REST API.
Source: https://docs.mistral.ai/api/
"""

# ─────────────────────────────────────────────
# Scalar types
# ─────────────────────────────────────────────

scalar DateTime
scalar JSON
scalar Float32

# ─────────────────────────────────────────────
# Enums
# ─────────────────────────────────────────────

enum Role {
  USER
  ASSISTANT
  SYSTEM
  TOOL
  FUNCTION
}

enum FinishReason {
  STOP
  LENGTH
  TOOL_CALLS
  ERROR
  FUNCTION_CALL
}

enum ToolChoiceMode {
  AUTO
  NONE
  ANY
  REQUIRED
}

enum ModelCapabilityType {
  CHAT
  EMBEDDINGS
  FIM
  CLASSIFICATION
  OCR
  FINE_TUNE
  VISION
  AUDIO
  BATCH
}

enum FineTuningJobStatus {
  QUEUED
  STARTED
  RUNNING
  FAILED
  SUCCESS
  CANCELLED
  CANCELLATION_REQUESTED
}

enum FineTuningJobType {
  TEXT
  VISION
  CLASSIFIER
}

enum BatchJobStatus {
  QUEUED
  RUNNING
  SUCCESS
  FAILED
  TIMEOUT_EXCEEDED
  CANCELLATION_REQUESTED
  CANCELLED
}

enum FileStatus {
  UPLOADED
  PROCESSING
  PROCESSED
  ERROR
}

enum FilePurpose {
  FINE_TUNE
  BATCH
  OCR
}

enum OCRType {
  IMAGE_URL
  DOCUMENT_URL
}

enum TranscriptionFormat {
  JSON
  TEXT
  VERBOSE_JSON
  VTT
  SRT
}

# ─────────────────────────────────────────────
# Message types
# ─────────────────────────────────────────────

"""A single turn message in a chat conversation."""
interface ChatMessage {
  role: Role!
  content: String
}

"""A message authored by the end user."""
type UserMessage implements ChatMessage {
  role: Role!
  content: String
  name: String
}

"""A message generated by the assistant model."""
type AssistantMessage implements ChatMessage {
  role: Role!
  content: String
  toolCalls: [ToolCall!]
  name: String
  prefix: Boolean
}

"""An instruction message that primes model behaviour."""
type SystemMessage implements ChatMessage {
  role: Role!
  content: String!
  name: String
}

"""The result of a tool invocation returned to the model."""
type ToolMessage implements ChatMessage {
  role: Role!
  content: String!
  toolCallId: String!
}

"""Legacy function call result message."""
type FunctionMessage implements ChatMessage {
  role: Role!
  content: String!
  name: String!
}

# ─────────────────────────────────────────────
# Tools and function calling
# ─────────────────────────────────────────────

"""A tool the model can invoke during a conversation."""
type Tool {
  type: String!
  function: Function!
}

"""JSON-schema-based function definition exposed to the model."""
type Function {
  name: String!
  description: String
  parameters: JSON
  strict: Boolean
}

"""A tool call issued by the model in its response."""
type ToolCall {
  id: String!
  type: String!
  function: ToolCallFunction!
  index: Int
}

"""The specific function invocation within a tool call."""
type ToolCallFunction {
  name: String!
  arguments: String!
}

"""Legacy function call (pre-tool-use API)."""
type FunctionCall {
  name: String!
  arguments: String!
}

"""Configuration controlling which tool the model must/may invoke."""
type ToolChoice {
  type: ToolChoiceMode!
  function: ToolChoiceFunction
}

"""Specifies a particular function to force-invoke."""
type ToolChoiceFunction {
  name: String!
}

# ─────────────────────────────────────────────
# Chat completions
# ─────────────────────────────────────────────

"""A request payload for the /v1/chat/completions endpoint."""
type ChatRequest {
  model: String!
  messages: [ChatMessage!]!
  temperature: Float
  topP: Float
  maxTokens: Int
  minTokens: Int
  stream: Boolean
  stop: [String!]
  randomSeed: Int
  responseFormat: JSON
  tools: [Tool!]
  toolChoice: ToolChoice
  presencePenalty: Float
  frequencyPenalty: Float
  n: Int
  safePrompt: Boolean
  documentImageLimit: Int
}

"""A non-streaming chat completion response."""
type ChatResponse {
  id: String!
  object: String!
  created: Int!
  model: String!
  choices: [Choice!]!
  usage: Usage!
}

"""Alias for ChatResponse — maps to the OpenAI ChatCompletion shape."""
type ChatCompletion {
  id: String!
  object: String!
  created: Int!
  model: String!
  choices: [Choice!]!
  usage: Usage!
}

"""A single completion alternative within a non-streaming response."""
type Choice {
  index: Int!
  message: AssistantMessage!
  finishReason: FinishReason
  logprobs: JSON
}

"""A single chunk delivered during server-sent-event streaming."""
type CompletionChunk {
  id: String!
  object: String!
  created: Int!
  model: String!
  choices: [StreamChoice!]!
  usage: Usage
}

"""A streaming choice delta within a CompletionChunk."""
type StreamChoice {
  index: Int!
  delta: Delta!
  finishReason: FinishReason
  logprobs: JSON
}

"""Partial content delivered in a streaming chunk."""
type Delta {
  role: Role
  content: String
  toolCalls: [ToolCall!]
  functionCall: FunctionCall
}

# ─────────────────────────────────────────────
# Embeddings
# ─────────────────────────────────────────────

"""A request payload for the /v1/embeddings endpoint."""
type EmbeddingRequest {
  model: String!
  input: [String!]!
  encodingFormat: String
}

"""The response returned by the embeddings endpoint."""
type EmbeddingResponse {
  id: String!
  object: String!
  data: [Embedding!]!
  model: String!
  usage: Usage!
}

"""A single embedding vector for one input string."""
type Embedding {
  object: String!
  embedding: [Float32!]!
  index: Int!
}

# ─────────────────────────────────────────────
# Text completions (legacy)
# ─────────────────────────────────────────────

"""Request payload for the legacy /v1/completions endpoint."""
type CompletionRequest {
  model: String!
  prompt: String!
  suffix: String
  temperature: Float
  topP: Float
  maxTokens: Int
  stream: Boolean
  randomSeed: Int
}

"""Response from the legacy completions endpoint."""
type CompletionResponse {
  id: String!
  object: String!
  created: Int!
  model: String!
  choices: [Choice!]!
  usage: Usage!
}

# ─────────────────────────────────────────────
# Models
# ─────────────────────────────────────────────

"""A paginated list of available Mistral models."""
type ModelList {
  object: String!
  data: [ModelInfo!]!
}

"""Metadata describing a single Mistral model."""
type ModelInfo {
  id: String!
  object: String!
  created: Int!
  ownedBy: String!
  name: String
  description: String
  maxContextLength: Int
  aliases: [String!]
  deprecation: DateTime
  defaultModelTemperature: Float
  type: String
  capabilities: ModelCapability
}

"""Flags indicating which capabilities a model supports."""
type ModelCapability {
  completionChat: Boolean!
  completionFim: Boolean!
  fineTuning: Boolean!
  functionCalling: Boolean!
  vision: Boolean!
  classification: Boolean!
}

# ─────────────────────────────────────────────
# Fill-in-the-Middle (FIM / Codestral)
# ─────────────────────────────────────────────

"""Request payload for the /v1/fim/completions endpoint."""
type FIMRequest {
  model: String!
  prompt: String!
  suffix: String
  temperature: Float
  topP: Float
  maxTokens: Int
  minTokens: Int
  stream: Boolean
  stop: [String!]
  randomSeed: Int
}

"""Response from the FIM completions endpoint."""
type FIMResponse {
  id: String!
  object: String!
  created: Int!
  model: String!
  choices: [Choice!]!
  usage: Usage!
}

# ─────────────────────────────────────────────
# OCR
# ─────────────────────────────────────────────

"""Request payload for the /v1/ocr endpoint."""
type OCRRequest {
  model: String!
  document: OCRDocument!
  id: String
  pages: [Int!]
  includeImageBase64: Boolean
  imageLimit: Int
  imageMinSize: Int
}

"""A document to be processed by the OCR endpoint."""
type OCRDocument {
  type: OCRType!
  imageUrl: String
  documentUrl: String
  documentName: String
}

"""The structured result returned by the OCR endpoint."""
type OCRResponse {
  pages: [OCRPage!]!
  model: String!
  usageInfo: OCRUsage!
}

"""Text and image content extracted from a single page."""
type OCRPage {
  index: Int!
  markdown: String!
  images: [OCRImage!]
  dimensions: OCRDimensions
}

"""An image extracted and optionally base64-encoded from an OCR page."""
type OCRImage {
  id: String!
  topLeftX: Int!
  topLeftY: Int!
  bottomRightX: Int!
  bottomRightY: Int!
  imageBase64: String
}

"""Physical dimensions of an OCR-processed page."""
type OCRDimensions {
  dpi: Int!
  height: Int!
  width: Int!
}

"""Token usage statistics for an OCR request."""
type OCRUsage {
  pagesProcessed: Int!
  docSizeBytes: Int
}

# ─────────────────────────────────────────────
# Fine-tuning
# ─────────────────────────────────────────────

"""A fine-tuning job submitted to the /v1/fine_tuning/jobs endpoint."""
type FineTuningJob {
  id: String!
  autoStart: Boolean!
  hyperparameters: FineTuningHyperparameters!
  model: String!
  status: FineTuningJobStatus!
  jobType: FineTuningJobType!
  createdAt: DateTime!
  modifiedAt: DateTime!
  trainedTokens: Int
  object: String!
  fineTunedModel: String
  repositories: [FineTuningRepository!]
  events: [FineTuningEvent!]
  checkpoints: [Checkpoint!]
  integrations: [FineTuningIntegration!]
}

"""Hyperparameter settings for a fine-tuning job."""
type FineTuningHyperparameters {
  trainingSteps: Int
  learningRate: Float
  weightDecay: Float
  warmupFraction: Float
  epochs: Float
  fimRatio: Float
  seqLen: Int
}

"""A repository of training/validation files for fine-tuning."""
type FineTuningRepository {
  type: String!
  name: String
  ref: String
  weight: Float
  samplingRate: Float
  trainingFiles: [TrainingFile!]
  validationFiles: [TrainingFile!]
}

"""A file used for fine-tuning training or validation."""
type TrainingFile {
  fileId: String!
  weight: Float
}

"""An event emitted during the lifecycle of a fine-tuning job."""
type FineTuningEvent {
  name: String!
  createdAt: DateTime!
  data: JSON
}

"""Metrics captured at a model checkpoint during training."""
type Checkpoint {
  metrics: TrainingResult!
  stepNumber: Int!
  createdAt: DateTime!
}

"""Loss and accuracy metrics recorded at a training checkpoint."""
type TrainingResult {
  trainLoss: Float
  validLoss: Float
  validMeanTokenAccuracy: Float
}

"""A third-party integration (e.g. WandB) attached to a fine-tuning job."""
type FineTuningIntegration {
  type: String!
  project: String
  name: String
  runName: String
}

# ─────────────────────────────────────────────
# Files
# ─────────────────────────────────────────────

"""A file object managed by the /v1/files endpoint."""
type FileObject {
  id: String!
  object: String!
  bytes: Int!
  createdAt: DateTime!
  filename: String!
  purpose: FilePurpose!
  status: FileStatus
  sampleType: [String!]
  numLines: Int
  source: String
}

# ─────────────────────────────────────────────
# Batch
# ─────────────────────────────────────────────

"""A batch inference job submitted to the /v1/batch/jobs endpoint."""
type BatchJob {
  id: String!
  object: String!
  inputFiles: [String!]!
  endpoint: String!
  model: String!
  outputFile: String
  errorFile: String
  status: BatchJobStatus!
  createdAt: DateTime!
  completedAt: DateTime
  totalRequests: Int!
  completedRequests: Int!
  failedRequests: Int!
  metadata: JSON
}

# ─────────────────────────────────────────────
# Audio transcription
# ─────────────────────────────────────────────

"""Response from the /v1/audio/transcriptions endpoint."""
type TranscriptionResponse {
  text: String!
  model: String
  language: String
  duration: Float
  words: [TranscriptionWord!]
  segments: [TranscriptionSegment!]
}

"""A word-level timestamp entry from a verbose transcription."""
type TranscriptionWord {
  word: String!
  start: Float!
  end: Float!
  speaker: String
}

"""A segment-level entry from a verbose transcription."""
type TranscriptionSegment {
  id: Int!
  seek: Int!
  start: Float!
  end: Float!
  text: String!
  tokens: [Int!]!
  temperature: Float!
  avgLogprob: Float!
  compressionRatio: Float!
  noSpeechProb: Float!
}

# ─────────────────────────────────────────────
# Identity & access
# ─────────────────────────────────────────────

"""An API key associated with a Mistral account."""
type APIKey {
  id: String!
  name: String!
  key: String
  createdAt: DateTime!
  lastUsedAt: DateTime
  expiresAt: DateTime
  teamId: String
}

"""A Mistral platform user account."""
type User {
  id: String!
  email: String!
  name: String
  createdAt: DateTime!
  role: String
}

"""A Mistral AI organization (workspace)."""
type Organization {
  id: String!
  name: String!
  createdAt: DateTime!
  members: [User!]
}

# ─────────────────────────────────────────────
# Usage & billing
# ─────────────────────────────────────────────

"""Token usage counts attached to a completion or embedding response."""
type Usage {
  promptTokens: Int!
  completionTokens: Int
  totalTokens: Int!
}

"""Detailed breakdown of input tokens by category."""
type InputTokens {
  textTokens: Int
  imageTokens: Int
  audioTokens: Int
  cachedTokens: Int
}

"""Detailed breakdown of output tokens."""
type OutputTokens {
  textTokens: Int
  audioTokens: Int
}

"""Aggregate token counts for a billing period."""
type TotalTokens {
  inputTokens: Int!
  outputTokens: Int!
  totalTokens: Int!
}

"""A high-level usage summary for an account or workspace."""
type UsageSummary {
  period: String!
  inputTokens: InputTokens!
  outputTokens: OutputTokens!
  totalTokens: TotalTokens!
  cost: Float!
  currency: String!
}

"""Billing data aggregated across an organization."""
type BillingData {
  organizationId: String!
  currentBalance: Float!
  currency: String!
  invoices: [Invoice!]
  usageSummaries: [UsageSummary!]
}

"""A billing invoice issued to a Mistral customer."""
type Invoice {
  id: String!
  amount: Float!
  currency: String!
  status: String!
  createdAt: DateTime!
  paidAt: DateTime
  downloadUrl: String
}

"""A waitlist entry for early access to Mistral features."""
type WaitlistEntry {
  id: String!
  email: String!
  feature: String!
  createdAt: DateTime!
  status: String!
  approvedAt: DateTime
}

# ─────────────────────────────────────────────
# Root operation types
# ─────────────────────────────────────────────

type Query {
  """List all available models."""
  models: ModelList!

  """Retrieve a specific model by ID."""
  model(id: String!): ModelInfo!

  """List fine-tuning jobs, optionally filtered by status."""
  fineTuningJobs(status: FineTuningJobStatus, page: Int, pageSize: Int): [FineTuningJob!]!

  """Retrieve a single fine-tuning job by ID."""
  fineTuningJob(id: String!): FineTuningJob!

  """List uploaded files."""
  files(purpose: FilePurpose, page: Int, pageSize: Int): [FileObject!]!

  """Retrieve a single file by ID."""
  file(id: String!): FileObject!

  """List batch jobs."""
  batchJobs(status: BatchJobStatus, page: Int, pageSize: Int): [BatchJob!]!

  """Retrieve a single batch job by ID."""
  batchJob(id: String!): BatchJob!

  """List API keys for the authenticated user."""
  apiKeys: [APIKey!]!

  """Get the authenticated user profile."""
  me: User!

  """Get organization details."""
  organization(id: String!): Organization!

  """Get billing data for an organization."""
  billingData(organizationId: String!): BillingData!

  """Get usage summary for a period."""
  usageSummary(period: String!, organizationId: String): UsageSummary!
}

type Mutation {
  """Create a chat completion (non-streaming)."""
  createChatCompletion(input: ChatCompletionInput!): ChatCompletion!

  """Create text embeddings."""
  createEmbeddings(input: EmbeddingInput!): EmbeddingResponse!

  """Create a FIM (fill-in-the-middle) code completion."""
  createFIMCompletion(input: FIMInput!): FIMResponse!

  """Process a document with OCR."""
  processOCR(input: OCRInput!): OCRResponse!

  """Create a fine-tuning job."""
  createFineTuningJob(input: FineTuningJobInput!): FineTuningJob!

  """Start a queued fine-tuning job."""
  startFineTuningJob(id: String!): FineTuningJob!

  """Cancel a running fine-tuning job."""
  cancelFineTuningJob(id: String!): FineTuningJob!

  """Archive a fine-tuned model."""
  archiveModel(id: String!): ModelInfo!

  """Unarchive a fine-tuned model."""
  unarchiveModel(id: String!): ModelInfo!

  """Delete a fine-tuned model."""
  deleteModel(id: String!): Boolean!

  """Delete a file."""
  deleteFile(id: String!): Boolean!

  """Create a batch job."""
  createBatchJob(input: BatchJobInput!): BatchJob!

  """Cancel a running batch job."""
  cancelBatchJob(id: String!): BatchJob!

  """Transcribe audio."""
  transcribeAudio(input: TranscriptionInput!): TranscriptionResponse!

  """Create a new API key."""
  createAPIKey(name: String!, expiresAt: DateTime): APIKey!

  """Delete an API key."""
  deleteAPIKey(id: String!): Boolean!
}

# ─────────────────────────────────────────────
# Input types
# ─────────────────────────────────────────────

input ChatCompletionInput {
  model: String!
  messages: [MessageInput!]!
  temperature: Float
  topP: Float
  maxTokens: Int
  minTokens: Int
  stop: [String!]
  randomSeed: Int
  responseFormat: JSON
  tools: [ToolInput!]
  toolChoice: String
  presencePenalty: Float
  frequencyPenalty: Float
  n: Int
  safePrompt: Boolean
}

input MessageInput {
  role: Role!
  content: String!
  name: String
  toolCallId: String
  toolCalls: [ToolCallInput!]
}

input ToolInput {
  type: String!
  function: FunctionInput!
}

input FunctionInput {
  name: String!
  description: String
  parameters: JSON
  strict: Boolean
}

input ToolCallInput {
  id: String!
  type: String!
  function: ToolCallFunctionInput!
}

input ToolCallFunctionInput {
  name: String!
  arguments: String!
}

input EmbeddingInput {
  model: String!
  input: [String!]!
  encodingFormat: String
}

input FIMInput {
  model: String!
  prompt: String!
  suffix: String
  temperature: Float
  topP: Float
  maxTokens: Int
  minTokens: Int
  stop: [String!]
  randomSeed: Int
}

input OCRInput {
  model: String!
  documentType: OCRType!
  documentUrl: String
  imageUrl: String
  documentName: String
  pages: [Int!]
  includeImageBase64: Boolean
  imageLimit: Int
}

input FineTuningJobInput {
  model: String!
  trainingFiles: [TrainingFileInput!]!
  validationFiles: [TrainingFileInput!]
  hyperparameters: HyperparametersInput
  jobType: FineTuningJobType
  autoStart: Boolean
  integrations: [IntegrationInput!]
}

input TrainingFileInput {
  fileId: String!
  weight: Float
}

input HyperparametersInput {
  trainingSteps: Int
  learningRate: Float
  weightDecay: Float
  warmupFraction: Float
  epochs: Float
  seqLen: Int
}

input IntegrationInput {
  type: String!
  project: String
  name: String
  apiKey: String
}

input BatchJobInput {
  inputFiles: [String!]!
  endpoint: String!
  model: String!
  metadata: JSON
  timeoutHours: Int
}

input TranscriptionInput {
  model: String!
  fileId: String
  language: String
  prompt: String
  responseFormat: TranscriptionFormat
  temperature: Float
  timestampGranularities: [String!]
  diarize: Boolean
}
