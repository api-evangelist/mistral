specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Mistral AI
providerId: mistral
created: '2026-05-04'
modified: '2026-05-04'
reconciled: true
tags:
  - Rate Limiting
  - AI
description: Mistral La Plateforme tiered rate limits.
sources:
  - https://mistral.ai/pricing
  - https://docs.mistral.ai/getting-started/rate_limits/
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
limits:
  - name: Free tier (RPS)
    scope: key
    metric: requests_per_second
    limit: 1
    timeFrame: second
  - name: Free tier (TPM)
    scope: key
    metric: tokens_per_minute
    limit: 500000
    timeFrame: minute
  - name: Paid tier (RPS)
    scope: key
    metric: requests_per_second
    limit: 10
    timeFrame: second
  - name: Paid tier (TPM)
    scope: key
    metric: tokens_per_minute
    limit: 5000000
    timeFrame: minute
